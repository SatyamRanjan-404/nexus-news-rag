version: '3.8'

services:
  # ── FastAPI Backend Service ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: nexus-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
      - ./news_sources.json:/app/news_sources.json:ro
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Streamlit Frontend Service ─────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    container_name: nexus-ui
    ports:
      - "8501:8501"
    environment:
      - NEXUS_API_URL=http://api:8000
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  chroma_data:
    driver: local