name: CI — Lint and Test

on:
  push:
    branches: [main, "phase/*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff==0.4.10
      - name: Run ruff check
        run: ruff check src/ tests/
      - name: Run ruff format check
        run: ruff format --check src/ tests/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU-only torch
        run: |
          pip install torch==2.2.2+cpu --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install package and test deps
        run: |
          pip install -e .
          pip install pytest pytest-mock pytest-asyncio pytest-cov
          pip install beautifulsoup4 simhash rank-bm25 rapidfuzz
          pip install sentence-transformers chromadb

      - name: Run unit tests (no API keys needed)
        env:
          GROQ_API_KEY: "test_key_not_used_in_unit_tests"
          INGEST_API_KEY: "test_ingest_key"
        run: pytest tests/unit/ -v -m "not slow and not integration" --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true

  regression-gate:
    name: Metric Regression Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check if regression thresholds file exists
        run: |
          if [ -f eval/results/thresholds.json ]; then
            echo "Regression thresholds file found — will run regression check"
          else
            echo "No thresholds file yet — skipping regression gate"
          fi
